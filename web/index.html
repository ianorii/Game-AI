<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game AI - A* Pathfinding</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Consolas', monospace;
            color: #fff;
            overflow: hidden;
        }
        #container {
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #b4e070;
        }
        canvas {
            border: 2px solid #333;
            display: block;
            margin: 0 auto;
        }
        #loading {
            font-size: 1.2rem;
            color: #888;
            margin-top: 20px;
        }
        #controls {
            font-size: 0.85rem;
            color: #666;
            margin-top: 15px;
            line-height: 1.8;
        }
        #controls span {
            background: #222;
            padding: 2px 8px;
            border-radius: 4px;
            color: #b4e070;
        }
    </style>
</head>
<body>
    <div id="container">
        <h1>Game AI - A* Pathfinding</h1>
        <div id="loading">Memuat game...</div>
        <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
        <div id="controls">
            <span>WASD</span> Gerak &nbsp;|&nbsp;
            <span>Klik Map</span> A* Path &nbsp;|&nbsp;
            <span>ESC</span> Settings &nbsp;|&nbsp;
            <span>F</span> NPC Follow
        </div>
    </div>
    <script>
        window.js = {
            agree: true,
            asset_dir: "../assets",
        };
    </script>
    <script src="https://pygbag.org/3.13/webgame.js"></script>
</body>
</html>
